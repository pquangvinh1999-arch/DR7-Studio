[package]
name = "rust_combat_sim"
version = "0.4.0"
edition = "2021"
description = "DR7-Studio 2D Dragon Ball Real-Time 2000+ Fighter Combat Core & Sprite Instance Batcher (Native + WASM)"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rust_bench"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
