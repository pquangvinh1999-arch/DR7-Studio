name: DR7-Studio Governance, Engine Parity & Unit Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js for Frontend + WASM E2E Test
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pixel asset verification dependencies
        run: python3 -m pip install numpy Pillow

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Run DR7 Governance & Engine-Localhost Parity Check
        run: ./loop.sh check

      - name: Run Python & Frontend WASM E2E Unit Tests
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Run Rust >2,000 Real-Time Combat Core Unit Tests
        run: cargo test --manifest-path engines/rust_combat_sim/Cargo.toml

      - name: Build Rust WASM library
        run: cargo build --manifest-path engines/rust_combat_sim/Cargo.toml --target wasm32-unknown-unknown --release --lib

      - name: Install verified Godot version
        run: bash tools/godot/install_godot.sh

      - name: Import textures and verify Godot character bundles
        run: |
          ./tools/godot/godot --headless --path . --editor --import
          timeout 60s ./tools/godot/godot --headless --path . --script res://tests/test_character_bundles.gd
          timeout 60s ./tools/godot/godot --headless --path . --script res://tests/test_tasmanian_charge.gd
          timeout 60s ./tools/godot/godot --headless --path . --script res://tests/test_sarcosuchus_charge.gd
          timeout 60s ./tools/godot/godot --headless --path . --script res://tests/test_dilophosaurus_power.gd
          timeout 60s ./tools/godot/godot --headless --path . --script res://tests/test_bat_sonic.gd
          timeout 60s ./tools/godot/godot --headless --path . --script res://tests/test_chilopoda_actions.gd
