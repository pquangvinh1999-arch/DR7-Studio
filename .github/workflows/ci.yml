name: DR7-Studio Governance, Engine Parity & Unit Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js for Frontend + WASM E2E Test
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run DR7 Governance & Engine-Localhost Parity Check
        run: ./loop.sh check

      - name: Run Python & Frontend WASM E2E Unit Tests
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Run Rust >2,000 Real-Time Combat Core Unit Tests
        run: cargo test --manifest-path engines/rust_combat_sim/Cargo.toml
